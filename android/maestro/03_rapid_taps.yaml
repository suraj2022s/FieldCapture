# Impatient or gloved hands: buttons tapped again before the app has caught up.
# The walk must settle in a consistent state, and a double tap must never start two jobs.
appId: app.fieldcapture
name: Rapid and double taps
---
- launchApp
# A job left open by an earlier failed flow would be resumed on launch: end it first.
- tapOn:
    text: "End job"
    optional: true
- tapOn:
    text: "Show developer tools"
    optional: true
- scrollUntilVisible:
    element: "Test feed"
    direction: DOWN
- tapOn: "Test feed"
- scrollUntilVisible:
    element: "Start job"
    direction: UP
# Double tap on Start job
- tapOn:
    text: "Start job"
    waitToSettleTimeoutMs: 50
- tapOn:
    text: "Start job"
    optional: true
    waitToSettleTimeoutMs: 50
- extendedWaitUntil:
    visible: "Recording"
    timeout: 15000
# Pause/Resume hammered, ending on Resume: the walk must end up ACTIVE
- tapOn:
    text: "Pause"
    waitToSettleTimeoutMs: 50
- tapOn:
    text: "Resume"
    waitToSettleTimeoutMs: 50
- tapOn:
    text: "Pause"
    waitToSettleTimeoutMs: 50
- tapOn:
    text: "Resume"
    waitToSettleTimeoutMs: 50
- extendedWaitUntil:
    visible: "Recording"
    timeout: 10000
# ... ending on Pause: the walk must end up PAUSED
- tapOn:
    text: "Pause"
    waitToSettleTimeoutMs: 50
- tapOn:
    text: "Resume"
    waitToSettleTimeoutMs: 50
- tapOn:
    text: "Pause"
    waitToSettleTimeoutMs: 50
- extendedWaitUntil:
    visible: "Paused"
    timeout: 10000
- waitForAnimationToEnd:
    timeout: 3000
- assertVisible: "Paused"
# Double tap on End job
- tapOn:
    text: "End job"
    waitToSettleTimeoutMs: 50
- tapOn:
    text: "End job"
    optional: true
    waitToSettleTimeoutMs: 50
- extendedWaitUntil:
    visible: "Start job"
    timeout: 10000
