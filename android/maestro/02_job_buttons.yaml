# A job driven only by the on-screen buttons: start, pause, resume, end, and a second job.
# The synthetic test feed is selected first, so nothing in the room is filmed.
appId: app.fieldcapture
name: Job buttons
---
- launchApp
# A job left open by an earlier failed flow would be resumed on launch: end it first.
- tapOn:
    text: "End job"
    optional: true
- tapOn:
    text: "Show developer tools"
    optional: true
- scrollUntilVisible:
    element: "Test feed"
    direction: DOWN
- tapOn: "Test feed"
- scrollUntilVisible:
    element: "Start job"
    direction: UP
- tapOn: "Start job"
- extendedWaitUntil:
    visible: "Recording"
    timeout: 15000
- tapOn: "Pause"
- extendedWaitUntil:
    visible: "Paused"
    timeout: 10000
- tapOn: "Resume"
- extendedWaitUntil:
    visible: "Recording"
    timeout: 10000
- tapOn: "End job"
- extendedWaitUntil:
    visible: "Start job"
    timeout: 10000
- assertVisible: "Last job: .*"
# A second job straight after the first (the Start job button used to disappear after a job ended)
- tapOn: "Start job"
- extendedWaitUntil:
    visible: "Recording"
    timeout: 15000
- tapOn: "End job"
- extendedWaitUntil:
    visible: "Start job"
    timeout: 10000
