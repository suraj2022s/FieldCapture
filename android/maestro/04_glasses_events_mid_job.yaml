# The simulated glasses misbehave mid-walk (Mock Device Kit buttons); the walk must recover each time.
appId: app.fieldcapture
name: Glasses events mid-job
---
- launchApp
# A job left open by an earlier failed flow would be resumed on launch: end it first.
- tapOn:
    text: "End job"
    optional: true
- tapOn:
    text: "Show developer tools"
    optional: true
- scrollUntilVisible:
    element: "Test feed"
    direction: DOWN
- tapOn: "Test feed"
- scrollUntilVisible:
    element: "Start job"
    direction: UP
- tapOn: "Start job"
- extendedWaitUntil:
    visible: "Recording"
    timeout: 15000

# Power off -> reconnecting; power on -> back
- scrollUntilVisible:
    element: "Power off"
    direction: DOWN
- tapOn: "Power off"
- scrollUntilVisible:
    element: "Reconnecting.*"
    direction: UP
    timeout: 20000
- scrollUntilVisible:
    element: "Power on"
    direction: DOWN
- tapOn: "Power on"
- scrollUntilVisible:
    element: "Recording"
    direction: UP
    timeout: 20000

# Taken off -> suspended; put on -> back
- scrollUntilVisible:
    element: "Doff"
    direction: DOWN
- tapOn: "Doff"
- scrollUntilVisible:
    element: "Glasses off"
    direction: UP
    timeout: 20000
- scrollUntilVisible:
    element: "Don"
    direction: DOWN
- tapOn: "Don"
- scrollUntilVisible:
    element: "Recording"
    direction: UP
    timeout: 20000

# Folded -> not active; unfolded and put on -> back
- scrollUntilVisible:
    element: "Fold"
    direction: DOWN
- tapOn: "Fold"
- tapOn: "Unfold"
- tapOn: "Don"
- scrollUntilVisible:
    element: "Recording"
    direction: UP
    timeout: 20000

# Overheat and low battery must not end the walk on the mock
- scrollUntilVisible:
    element: "Overheat"
    direction: DOWN
- tapOn: "Overheat"
- tapOn: "Battery 5%"
- tapOn: "Cool"
- tapOn: "Battery 80%"
- scrollUntilVisible:
    element: "Recording"
    direction: UP
    timeout: 20000
- tapOn: "End job"
- extendedWaitUntil:
    visible: "Start job"
    timeout: 10000
