# The tech leaves the app mid-walk (home button, a call) and comes back: the walk must carry on.
appId: app.fieldcapture
name: Leave the app mid-job and come back
---
- launchApp
# A job left open by an earlier failed flow would be resumed on launch: end it first.
- tapOn:
    text: "End job"
    optional: true
- tapOn:
    text: "Show developer tools"
    optional: true
- scrollUntilVisible:
    element: "Test feed"
    direction: DOWN
- tapOn: "Test feed"
- scrollUntilVisible:
    element: "Start job"
    direction: UP
- tapOn: "Start job"
- extendedWaitUntil:
    visible: "Recording"
    timeout: 15000
- pressKey: Home
- waitForAnimationToEnd:
    timeout: 8000
- launchApp:
    stopApp: false
- extendedWaitUntil:
    visible: "Recording"
    timeout: 20000
# The live view shows a fresh picture again (it says "No picture from the glasses" when frames stop)
- waitForAnimationToEnd:
    timeout: 3000
- assertNotVisible: "No picture from the glasses"
- assertVisible: "What the glasses see"
- tapOn: "End job"
- extendedWaitUntil:
    visible: "Start job"
    timeout: 10000
