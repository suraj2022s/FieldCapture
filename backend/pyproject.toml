[project]
name = "fieldcapture-backend"
version = "0.1.0"
description = "FieldCapture back office: idempotent capture ingest, Claude extraction, line-item rules, job records"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "python-multipart>=0.0.9",
    "anthropic>=1.0",
    "pydantic>=2.7",
    "jsonschema>=4.22",
    "pillow>=10.4",
]

[dependency-groups]
dev = ["pytest>=8.2", "httpx>=0.27"]

[project.scripts]
fieldcapture-server = "fieldcapture_backend.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["fieldcapture_backend"]

[tool.pytest.ini_options]
testpaths = ["tests"]
